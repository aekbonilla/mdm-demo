# ─────────────────────────────────────────────────────────────────────────────
#  MDM Demo Stack
#  Android:  Headwind MDM   → http://localhost:8080  (admin / hmdm)
#  iOS:      NanoMDM        → http://localhost:9000
#  Attack:   mitmproxy UI   → http://localhost:8082  proxy → :8081
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Shared PostgreSQL (Headwind MDM + NanoMDM) ──────────────────────────────
  hmdm-db:
    image: postgres:14-alpine
    container_name: hmdm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       hmdm
      POSTGRES_USER:     hmdm
      POSTGRES_PASSWORD: hmdm_pass
      # Extra DB for NanoMDM created via init script
    volumes:
      - hmdm_db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - mdm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmdm"]
      interval: 10s
      timeout: 5s
      retries: 5

  hmdm:
    image: headwindmdm/hmdm:latest
    container_name: hmdm-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "31000:31000"
    environment:
      - SQL_HOST=hmdm-db
      - SQL_PORT=5432
      - SQL_BASE=hmdm
      - SQL_USER=hmdm
      - SQL_PASS=hmdm_pass
      - BASE_DOMAIN=localhost
      - SERVER_PORT=8080
      - PROTOCOL=http
    depends_on:
      hmdm-db:
        condition: service_healthy
    volumes:
      - hmdm_files:/opt/hmdm/files
    networks:
      - mdm-net

  # ── iOS MDM ──────────────────────────────────────────────────────────────────
  nanomdm:
    image: ghcr.io/micromdm/nanomdm:latest
    container_name: nanomdm-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    configs:
      - source: nanomdm_ca
        target: /certs/ca.crt
        mode: 0444
    depends_on:
      hmdm-db:
        condition: service_healthy
    command:
      - "-storage"
      - "pgsql"
      - "-storage-dsn"
      - "host=hmdm-db dbname=nanomdm user=hmdm password=hmdm_pass sslmode=disable"
      - "-api"
      - "nanomdm"
      - "-listen"
      - ":9000"
      - "-ca"
      - "/certs/ca.crt"
    networks:
      - mdm-net

  # ── Network Attack Simulation ────────────────────────────────────────────────
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy
    restart: unless-stopped
    ports:
      - "8081:8080"   # proxy listener
      - "8082:8081"   # web UI
    command: mitmweb --web-host 0.0.0.0 --listen-host 0.0.0.0 --listen-port 8080 --web-port 8081 --set web_password=admin
    networks:
      - mdm-net

networks:
  mdm-net:
    driver: bridge

